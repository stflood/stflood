<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тех. Поддержка — St. Flood</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="sup-page">

<div class="header">
  <div class="header-left">
    <img class="header-avatar" src="img/avatar.jpg" alt="avatar">
    <div class="header-title">･⁠⁠⁠⁠Ꮥ𐐆 𐔥ᥣ𐔖𐔖ᦔ ･</div>
  </div>
  <div class="header-center">Сайт флуда St. Flood</div>
  <nav class="tabs">
    <a href="index.html">Основное</a>
    <a href="links.html">Связи</a>
    <a href="admins.html">Админы</a>
    <a class="active" href="support.html">Тех. Поддержка</a>
  </nav>
</div>
<div class="sep"></div>
<div class="content">

  <div class="support-center">

    <div class="sup-head">
      <div class="sup-head-title">Обращения</div>
      <div class="sup-auth" id="supAuth"></div>
    </div>

    <div class="sup-feed" id="supFeed"></div>
    <div class="support-empty" id="supEmpty">Пока нет обращений</div>

    <div class="sup-dialog-input">
      <input id="supDialogInput" type="text" placeholder="Введите текст..." autocomplete="off">
      <button class="sup-send" id="supDialogSend" title="Отправить">↑</button>
    </div>

  </div>

</div>

<div class="support-modal" id="supCloseModal">
  <div class="support-modal-box">
    <div class="support-modal-title">Закрыть обращение</div>
    <div class="support-modal-label">Причина закрытия</div>
    <textarea id="supCloseReason" placeholder="Напишите, почему закрываете обращение..."></textarea>
    <div class="sup-close-error" id="supCloseError">Напишите причину — пустое поле нельзя!</div>
    <div class="support-modal-btns">
      <button class="support-btn support-btn-ghost" id="supCloseCancel">Отмена</button>
      <button class="support-btn support-btn-danger" id="supCloseConfirm">Закрыть</button>
    </div>
  </div>
</div>

<div class="support-modal" id="authModal">
  <div class="support-modal-box">
    <div class="support-modal-title" id="authTitle">Вход</div>
    <div class="auth-switch">
      <button type="button" class="auth-switch-btn auth-switch-active" id="authTabLogin">Вход</button>
      <button type="button" class="auth-switch-btn" id="authTabReg">Регистрация</button>
    </div>
    <div class="support-modal-label" id="authLabelNick" style="display:none">Ник</div>
    <input id="authNickInput" type="text" placeholder="Ваш ник" autocomplete="off" style="display:none">
    <div class="support-modal-label">E-mail</div>
    <input id="authEmailInput" type="email" placeholder="email@example.com" autocomplete="email">
    <div class="support-modal-label">Пароль</div>
    <input id="authPassInput" type="password" placeholder="Минимум 6 символов" autocomplete="current-password">
    <div class="sup-close-error" id="authError"></div>
    <div class="support-modal-btns">
      <button class="support-btn support-btn-ghost" id="authCancel">Отмена</button>
      <button class="support-btn support-btn-primary" id="authSubmit">Войти</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/support.js"></script>
</body>
</html>
