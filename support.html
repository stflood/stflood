<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тех. Поддержка — St. Flood</title>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="sup-page">


<header class="header">
  <div class="header-left">
    <button type="button" class="menu-toggle" id="menuToggle" title="Открыть меню">☰</button>
    <img class="header-avatar" src="img/avatar.jpg" alt="avatar">
    <div class="header-title">St. Flood</div>
  </div>
  <div class="header-center">Сайт флуда St. Flood</div>
  <div class="header-right" id="hdrAuth"></div>
</header>
<div class="sep"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<nav class="sidebar" id="sidebar">
  <button type="button" class="sidebar-close" id="sidebarClose" title="Закрыть меню">✕</button>
  <div class="sidebar-logo">St. Flood</div>
  <div class="sidebar-center">Навигация</div>
  <div class="tabs">
    <a href='index.html'><span class='ico'>🏠</span>Основное</a>
    <a href='news.html'><span class='ico'>📢</span>Новости</a>
    <a href='links.html'><span class='ico'>🔗</span>Связи</a>
    <a href='admins.html'><span class='ico'>👑</span>Админы</a>
    <a href='support.html' class="active"><span class='ico'>🛠️</span>Тех. Поддержка</a>
    <a href='achievements.html'><span class='ico'>🏆</span>Достижения</a>
    <a href='users.html'><span class='ico'>👥</span>Пользователи</a>
  </div>
  <div class="sidebar-user" id="sidebarUser"></div>

</nav>

<div class="content">

  <div class="support-center">

    <div class="sup-head">
      <div class="sup-head-title">Обращения</div>
    </div>

    <div class="sup-body">
      <div class="sup-requests" id="supRequests"></div>

      <div class="sup-chat-wrap" id="supChatWrap">
        <div class="sup-feed" id="supFeed"></div>

        <div class="support-empty" id="supEmpty">
          <div id="supAuthPrompt">
            <div class="sup-auth-prompt-title">Войди, чтобы писать сообщения</div>
            <div class="sup-auth-prompt-btns">
              <button type="button" class="sup-btn-primary" id="supLoginBtn">Войти</button>
              <button type="button" class="sup-btn-register" id="supRegBtn">Регистрация</button>
            </div>
          </div>
          <span id="supNoMessages">Пока нет обращений</span>
        </div>

        <div class="sup-dialog-input">
          <input id="supDialogInput" type="text" placeholder="Введите текст..." autocomplete="off">
          <button class="sup-send" id="supDialogSend" title="Отправить">↑</button>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="support-modal" id="supCloseModal">
  <div class="support-modal-box">
    <div class="support-modal-title">Закрыть обращение</div>
    <div class="support-modal-label">Причина закрытия</div>
    <textarea id="supCloseReason" placeholder="Напишите, почему закрываете обращение..."></textarea>
    <div class="sup-close-error" id="supCloseError">Напишите причину — пустое поле нельзя!</div>
    <div class="support-modal-btns">
      <button class="support-btn support-btn-ghost" id="supCloseCancel">Отмена</button>
      <button class="support-btn support-btn-danger" id="supCloseConfirm">Закрыть</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/vendor/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/support.js"></script>

<script>
/* ─── открытие/закрытие меню (только телефон) ─── */
var sidebar = document.getElementById('sidebar');
var backdrop = document.getElementById('sidebarBackdrop');
var isMobile = function () { return window.innerWidth <= 900; };
function openMenu() {
  if (!isMobile()) return;
  document.body.classList.remove('menu-close');
  document.body.classList.add('menu-open');
  if (sidebar) sidebar.classList.remove('closed');
}
function closeMenu() {
  if (!isMobile()) return;
  document.body.classList.remove('menu-open');
  document.body.classList.add('menu-close');
  if (sidebar) sidebar.classList.add('closed');
}
var mt = document.getElementById('menuToggle');
if (mt) mt.addEventListener('click', function () {
  if (!isMobile()) return;
  var open = document.body.classList.contains('menu-open');
  if (open) { closeMenu(); } else { openMenu(); }
});
var sc = document.getElementById('sidebarClose');
if (sc) sc.addEventListener('click', closeMenu);
if (backdrop) backdrop.addEventListener('click', closeMenu);
var sa = document.querySelectorAll('.sidebar .tabs a');
for (var si = 0; si < sa.length; si++) {
  sa[si].addEventListener('click', function () { if (isMobile()) closeMenu(); });
}
window.addEventListener('resize', function () {
  if (!isMobile()) {
    document.body.classList.remove('menu-open', 'menu-close');
    if (sidebar) sidebar.classList.remove('closed');
  }
});
</script>
</body>
</html>
