<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Достижения — St. Flood</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>


<header class="header">
  <div class="header-left">
    <button type="button" class="menu-toggle" id="menuToggle" title="Открыть меню">☰</button>
    <img class="header-avatar" src="img/avatar.jpg" alt="avatar">
    <div class="header-title">St. Flood</div>
  </div>
  <div class="header-center">Сайт флуда St. Flood</div>
  <div class="header-right" id="hdrAuth"></div>
</header>
<div class="sep"></div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<nav class="sidebar" id="sidebar">
  <button type="button" class="sidebar-close" id="sidebarClose" title="Закрыть меню">✕</button>
  <div class="sidebar-logo">St. Flood</div>
  <div class="sidebar-center">Навигация</div>
  <div class="tabs">
    <a href='index.html'><span class='ico'>🏠</span>Основное</a>
    <a href='news.html'><span class='ico'>📢</span>Новости</a>
    <a href='links.html'><span class='ico'>🔗</span>Связи</a>
    <a href='admins.html'><span class='ico'>👑</span>Админы</a>
    <a href='support.html'><span class='ico'>🛠️</span>Тех. Поддержка</a>
    <a href='achievements.html' class="active"><span class='ico'>🏆</span>Достижения</a>
    <a href='users.html'><span class='ico'>👥</span>Пользователи</a>
  </div>
  <div class="sidebar-user" id="sidebarUser"></div>

</nav>


<div class="content">

  <div class="ach-title">Уголок Достижений</div>
  <div class="ach-desc">Хвастайся тем, чем гордишься — сначала пройдёт проверку, потом появится тут.</div>

  <div class="ach-form-box" id="achForm" style="display:none">
    <div class="ach-form-label">Чем хочешь похвастаться?</div>
    <div class="ach-toolbar">
      <button type="button" class="ach-fmt" data-fmt="**" title="Жирный">B</button>
      <button type="button" class="ach-fmt ach-fmt-i" data-fmt="*" title="Курсив">K</button>
      <button type="button" class="ach-fmt ach-fmt-u" data-fmt="__" title="Подчёркнутый">Ч</button>
    </div>
    <textarea id="achInput" rows="3" maxlength="300" placeholder="Напиши о своём достижении..."></textarea>
    <div class="ach-img-row">
      <input type="file" id="achImage" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
      <button type="button" class="support-btn" id="achImgBtn">📷 Добавить картинку</button>
      <span class="ach-img-name" id="achImgName"></span>
      <img class="ach-img-preview" id="achImgPreview" alt="preview" style="display:none">
      <button type="button" class="sup-btn-danger" id="achImgClear" style="display:none">Убрать</button>
    </div>
    <div class="sup-close-error" id="achFormError" style="display:none"></div>
    <button type="button" class="support-btn support-btn-primary" id="achSubmit">Отправить на проверку</button>
  </div>

  <div id="achStaffSection" style="display:none">
    <div class="ach-subtitle">⚠ На проверке (<span id="achPendingCount">0</span>)</div>
    <div id="achPending"></div>
  </div>

  <div id="achMyPending" style="display:none">
    <div class="ach-subtitle">Мои на проверке</div>
    <div id="achMyPendingList"></div>
  </div>

  <div class="ach-subtitle">Опубликованные</div>
  <div id="achPublished"></div>

</div>

<script src="js/config.js"></script>
<script src="js/vendor/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/achievements.js"></script>

<script>
/* ─── открытие/закрытие меню (только телефон) ─── */
var sidebar = document.getElementById('sidebar');
var backdrop = document.getElementById('sidebarBackdrop');
var isMobile = function () { return window.innerWidth <= 900; };
function openMenu() {
  if (!isMobile()) return;
  document.body.classList.remove('menu-close');
  document.body.classList.add('menu-open');
  if (sidebar) sidebar.classList.remove('closed');
}
function closeMenu() {
  if (!isMobile()) return;
  document.body.classList.remove('menu-open');
  document.body.classList.add('menu-close');
  if (sidebar) sidebar.classList.add('closed');
}
var mt = document.getElementById('menuToggle');
if (mt) mt.addEventListener('click', function () {
  if (!isMobile()) return;
  var open = document.body.classList.contains('menu-open');
  if (open) { closeMenu(); } else { openMenu(); }
});
var sc = document.getElementById('sidebarClose');
if (sc) sc.addEventListener('click', closeMenu);
if (backdrop) backdrop.addEventListener('click', closeMenu);
var sa = document.querySelectorAll('.sidebar .tabs a');
for (var si = 0; si < sa.length; si++) {
  sa[si].addEventListener('click', function () { if (isMobile()) closeMenu(); });
}
window.addEventListener('resize', function () {
  if (!isMobile()) {
    document.body.classList.remove('menu-open', 'menu-close');
    if (sidebar) sidebar.classList.remove('closed');
  }
});
</script>
</body>
</html>
